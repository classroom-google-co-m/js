<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://classroom-google-co-m.github.io/ultrakill/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity WebGL Player | ULTRAKILL</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: black;
        }
        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #unity-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            border: 0;
            outline: none;
        }
        html:fullscreen,
        html:fullscreen body {
            width: 100%;
            height: 100%;
            background: black;
        }
        #loading-text {
            color: white;
            font-family: cursive;
            font-size: 48px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="loading-text">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    <script src="Build/ultrakill.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        async function enterFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
            } catch (error) {
                console.log("Fullscreen request denied:", error);
            }
        }
        // Enter fullscreen on first user interaction
        document.addEventListener("click", enterFullscreen, {
            once: true
        });
        document.addEventListener("keydown", function(event) {
            if (
                event.ctrlKey &&
                event.key.toLowerCase() === "w"
            ) {
                event.preventDefault();
            }
        });
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement("meta");
            meta.name = "viewport";
            meta.content =
                "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
            document.head.appendChild(meta);
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);
            document.addEventListener("fullscreenchange", resizeCanvas);
        }
        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index])
                        .then(response => {
                            if (!response.ok) {
                                throw new Error("Failed to load: " + fileParts[index]);
                            }
                            return response.arrayBuffer();
                        })
                        .then(data => {
                            buffers.push(data);
                            fetchPart(index + 1);
                        })
                        .catch(reject);
                }
                fetchPart(0);
            });
        }
        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4)),
            mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2))
        ])
        .then(([dataUrl, wasmurl]) => {
            canvas.hidden = false;
            createUnityInstance(canvas, {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita and Cake Logic",
                productName: "ULTRAKILL",
                productVersion: "1.4"
            }).then((instance) => {
                document.querySelector("#loading-text").remove();
                resizeCanvasIfNeeded();
            }).catch(error => {
                console.error("Unity initialization failed:", error);
            });
        })
        .catch(error => {
            console.error("Game loading failed:", error);
            document.querySelector("#loading-text").textContent =
                "FAILED TO LOAD GAME";
        });
        function resizeCanvasIfNeeded() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }
    </script>
</body>
</html>
